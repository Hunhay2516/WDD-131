<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
    <link rel="stylesheet" href="recipes.css">
</head>
<body>
    <img src="images\recipe-book.png" alt="Recipe Image">
    <h1>RECIPEBOOK</h1>

    <div class="searchbar">
        <input type="text" placeholder="Find a recipe">
        <img src="images/search.svg" alt="Search Icon">
    </div>

    <hr>

    <div class="recipie">
        <img src="images/apple-crisp.jpg" alt="Apple Crisp">
        <p>Desert tag</p>
        <h2>Apple Crisp</h2>
    </div>

    <div class="platform_links">
        <a href="#instagram"><img src="images/instagram_icon.svg" alt="Instagram Link"></a>
        <a href="#youtube"><img src="images/youtube_icon.svg" alt="Youtube Link"></a>
        <a href="#pinterest"><img src="images/pinterest_icon.svg" alt="Pinterest Link"></a>
    </div>
</body>
</html>
